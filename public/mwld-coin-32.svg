<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>MWLD</title>
  <defs>
    <linearGradient id="rim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff3bf"/>
      <stop offset="0.35" stop-color="#f6c443"/>
      <stop offset="0.7" stop-color="#c98a16"/>
      <stop offset="1" stop-color="#7a4a08"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0.85" y1="1" x2="0.15" y2="0">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="1" stop-color="#8a5a0c"/>
    </linearGradient>
    <radialGradient id="space" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3554b8"/>
      <stop offset="0.55" stop-color="#16246b"/>
      <stop offset="1" stop-color="#070d33"/>
    </radialGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c8f2"/>
    </linearGradient>
  </defs>
  <!-- gold rim -->
  <circle cx="16" cy="16" r="15.5" fill="url(#rim)"/>
  <circle cx="16" cy="16" r="15.2" fill="none" stroke="#5e3604" stroke-width="0.6" opacity="0.7"/>
  <!-- inner bevel and space face -->
  <circle cx="16" cy="16" r="12.4" fill="url(#bevel)"/>
  <circle cx="16" cy="16" r="11.6" fill="url(#space)"/>
  <!-- stars -->
  <circle cx="10.2" cy="9.6" r="0.45" fill="#fff" opacity="0.85"/>
  <circle cx="22.4" cy="8.9" r="0.35" fill="#fff" opacity="0.7"/>
  <circle cx="24.2" cy="15.2" r="0.3" fill="#fff" opacity="0.6"/>
  <circle cx="8.3" cy="15.6" r="0.3" fill="#fff" opacity="0.6"/>
  <!-- M with a swoosh (slanted like the coin art) -->
  <g transform="translate(3.4 0) skewX(-12)">
  <path d="M9.4 20.2C10.6 15.4 11.6 11.6 12.9 11.6C14.3 11.6 13.9 16.4 15.6 16.4C17.3 16.4 18 11.2 19.9 11.2C21.6 11.2 21.2 16.6 23 19" fill="none" stroke="url(#m)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.2 21.6C12.6 19.4 18.6 19.5 24.2 22" fill="none" stroke="#e8eeff" stroke-width="1.05" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- rim shine -->
  <path d="M5.2 10.4A12 12 0 0 1 14.6 3.6" fill="none" stroke="#fffbe6" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
